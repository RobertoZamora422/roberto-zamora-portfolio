<script>
(() => {
  const root = document.getElementById("ec-preview");
  const site = root.querySelector(".ec-site");
  const content = root.querySelector("[data-page-content]");
  const choice = root.querySelector("[data-view-choice]");
  const status = root.querySelector("[data-preview-status]");
  const views = Object.fromEntries(
    Array.from(root.querySelectorAll("template[data-view]"), (view) => [view.dataset.view, view])
  );
  const labels = {
    caso: "Caso de estudio", inicio: "Inicio", proyecto: "Proyecto", proyectos: "Proyectos", rfm: "RFM CORE",
    casos: "Casos de estudio", perfil: "Sobre mí", cv: "CV", contacto: "Contacto"
  };
  const parents = { caso: "casos", proyecto: "proyectos", rfm: "proyectos" };
  const widths = { desktop: "Escritorio", mobile: "Móvil, 390 píxeles", compact: "Móvil, 320 píxeles" };
  let device = "desktop";
  let page = "caso";
  let index = null;
  let indexLinks = [];
  let sections = [];
  let narrow = null;
  let jumpPosition = null;
  let scrollFrame = 0;

  function updateStatus() {
    status.textContent = labels[page] + " · " + widths[device];
  }

  function setActiveSection(id) {
    if (!index) return;
    for (const link of indexLinks) {
      if (link.dataset.jump === id) {
        link.setAttribute("aria-current", "location");
        index.querySelector("[data-index-current]").textContent = link.textContent;
      } else {
        link.removeAttribute("aria-current");
      }
    }
  }

  function adaptIndex() {
    const isNarrow = site.clientWidth <= 620;
    if (index && isNarrow !== narrow) index.open = !isNarrow;
    narrow = isNarrow;
  }

  function trackSection() {
    if (!sections.length) return;
    if (jumpPosition !== null && Math.abs(window.scrollY - jumpPosition) < 2) return;
    jumpPosition = null;
    let current = sections[0];
    for (const section of sections) {
      if (section.getBoundingClientRect().top <= 80) current = section;
    }
    if (window.scrollY > 0 && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) {
      current = sections.at(-1);
    }
    setActiveSection(current.id);
  }

  function render(next) {
    const viewName = next === "contacto" ? "cv" : next;
    const view = views[viewName];
    if (!view) return;
    page = next;
    content.replaceChildren(view.content.cloneNode(true));
    choice.value = viewName;
    index = content.querySelector(".ec-contents");
    indexLinks = index ? Array.from(index.querySelectorAll("[data-jump]")) : [];
    sections = indexLinks.map((link) => document.getElementById(link.dataset.jump)).filter(Boolean);
    narrow = null;
    jumpPosition = null;
    adaptIndex();
    for (const link of root.querySelectorAll(".ec-header [data-page]")) {
      if (link.dataset.page === (parents[next] || next)) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    }
    updateStatus();
  }

  choice.addEventListener("change", () => render(choice.value));
  new ResizeObserver(adaptIndex).observe(site);
  window.addEventListener("scroll", () => {
    if (scrollFrame) return;
    scrollFrame = requestAnimationFrame(() => {
      scrollFrame = 0;
      trackSection();
    });
  }, { passive: true });

  root.addEventListener("click", (event) => {
    const viewport = event.target.closest("[data-viewport]");
    if (viewport) {
      device = viewport.dataset.viewport;
      root.dataset.device = device;
      for (const button of root.querySelectorAll("[data-viewport]")) {
        button.setAttribute("aria-pressed", String(button.dataset.viewport === device));
      }
      adaptIndex();
      updateStatus();
      return;
    }
    const jump = event.target.closest("[data-jump]");
    if (jump) {
      const target = document.getElementById(jump.dataset.jump);
      if (target) {
        event.preventDefault();
        if (narrow && index?.contains(jump) && event.detail !== 0) index.open = false;
        target.scrollIntoView({ block: "start" });
        jumpPosition = window.scrollY;
        setActiveSection(target.id);
        if (event.detail === 0) target.querySelector("summary")?.focus({ preventScroll: true });
      }
      return;
    }
    const link = event.target.closest("[data-page]");
    if (!link) return;
    const insideContent = content.contains(link);
    event.preventDefault();
    render(link.dataset.page);
    if (page === "contacto") document.getElementById("ec-contacto")?.scrollIntoView({ block: "nearest" });
    else if (insideContent) {
      root.querySelector('.ec-header [aria-current="page"]')?.focus({ preventScroll: true });
      root.querySelector(".ec-site").scrollIntoView({ block: "start" });
    }
  });

  render(page);
})();
</script>
